[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentos"
version = "0.1.0"
description = "Autonomous Agent CLI Framework - Open source AI agent with planning, execution, safety, and memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AgentOS Team" }
]
keywords = [
    "ai",
    "agent",
    "autonomous-agent",
    "llm",
    "cli",
    "agentic-ai",
    "openrouter",
    "autonomous-agent-framework",
    "task-decomposition",
    "tool-planning",
    "safety",
    "memory",
    "research",
    "coding-agent",
    "ai-agents",
    "multi-agent",
    "romm",
    "mosaic",
    "htaa",
    "tooltree",
    "redererf",
    "intention",
    "infiagent",
    "context-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "tiktoken>=0.5.0",
    "chromadb>=0.4.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "httpx[http2]>=0.27.0",
]

[project.scripts]
agentos = "agentos.cli:main"

[project.urls]
Homepage = "https://github.com/agentos/agentos"
Documentation = "https://github.com/agentos/agentos#readme"
Repository = "https://github.com/agentos/agentos"
Issues = "https://github.com/agentos/agentos/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
